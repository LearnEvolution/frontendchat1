<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatZap — Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-logo">💬</div>
    <h1 class="auth-titulo">ChatZap</h1>
    <p class="auth-sub">Seu chat privado com amigos</p>

    <!-- ABAS -->
    <div class="abas">
      <button class="aba ativa" onclick="trocarAba('login')">Entrar</button>
      <button class="aba" onclick="trocarAba('cadastro')">Cadastrar</button>
    </div>

    <!-- LOGIN -->
    <div id="form-login" class="form-box">
      <input type="email" id="login-email" placeholder="Seu email" />
      <input type="password" id="login-senha" placeholder="Sua senha" />
      <button class="btn-principal" onclick="fazerLogin()">Entrar</button>
      <p id="login-erro" class="erro"></p>
    </div>

    <!-- CADASTRO — PASSO 1 -->
    <div id="form-cadastro" class="form-box escondido">
      <input type="text" id="cad-nome" placeholder="Seu nome" />
      <input type="email" id="cad-email" placeholder="Seu email" />
      <input type="password" id="cad-senha" placeholder="Sua senha" />
      <button class="btn-principal" onclick="enviarCodigo()">Enviar código de verificação</button>
      <p id="cad-erro" class="erro"></p>
      <p id="cad-sucesso" class="sucesso"></p>
    </div>

    <!-- CADASTRO — PASSO 2 -->
    <div id="form-verificacao" class="form-box escondido">
      <p style="color:#94a3b8;font-size:14px;text-align:center;margin-bottom:8px;">
        📧 Código enviado pro seu email!<br>Digite os 4 dígitos abaixo:
      </p>
      <input
        type="number"
        id="cad-codigo"
        placeholder="0000"
        maxlength="4"
        style="text-align:center;font-size:28px;font-weight:900;letter-spacing:8px;"
      />
      <button class="btn-principal" onclick="verificarECadastrar()">✅ Verificar e Cadastrar</button>
      <button class="btn-reenviar" onclick="voltarCadastro()">← Voltar</button>
      <p id="ver-erro" class="erro"></p>
    </div>

  </div>

  <script src="js/auth.js"></script>
</body>
</html>
